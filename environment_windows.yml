name: rapidbenthos
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pytorch=2.0.1
  - pytorch-cuda=11.7
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - cudatoolkit=11.7
  - gdal=3.6.2
  - numpy=1.24.3
  - pillow=9.4.0
  - pip
  - pip:
    - affine
    - fiona
    - geopandas
    - rasterio
    - pyproj
    - shapely
    - opencv-python
    - matplotlib
    - pandas
    - scikit-learn
    - scipy
    - tqdm
    - segment-anything-py
    - segment-geospatial==0.10.7
    - leafmap==0.35.11
    - ipywidgets
    - ipyleaflet
    - folium
    - gdown
    - huggingface-hub
    - pycocotools
    - pystac
    - pystac-client
    - duckdb==0.9.2