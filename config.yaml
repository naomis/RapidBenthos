# ================================================================
# RapidBenthos — config.yaml
# ================================================================

site:
  plot_id:    "M7_test"
  # Ortho mounted from DATA_PATH in .env
  ortho:      "/app/data/M7_test_small.tif"
  # Outputs written to OUTPUT_PATH in .env
  out_folder: "/app/outputs"

metashape:
  # PSX project mounted from DATA_PATH in .env
  project_path: "/app/data/M7_0326.psx"
  chunk_number: 0
  # Photos mounted from PHOTOS_PATH in .env
  photo_path:   "/app/photos"

sam:
  # Checkpoint mounted from CHECKPOINT_PATH in .env
  checkpoint:  "/app/checkpoints/sam_vit_h_4b8939.pth"
  model_type:  "vit_h"