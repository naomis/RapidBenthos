# ================================================================
# RapidBenthos — docker-compose.yml
# ================================================================

services:

  # ── Traitement principal Part 1 ────────────────────────────────
  rapidbenthos:

    build:
      context: .
      dockerfile: Dockerfile

    image: rapidbenthos:latest
    container_name: rapidbenthos_${PLOT_ID:-SITE}

    tty: true
    stdin_open: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    env_file: .env

    environment:
      - PYTHONPATH=/app/Scripts:/app
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - AGISOFT_LICENSE_KEY=${METASHAPE_LICENSE_KEY}

    volumes:
      # Données site (tif + psx) → /app/data
      - ${DATA_PATH}:/app/data:ro
      # Photos JPG → /app/photos
      - ${PHOTOS_PATH}:/app/photos:ro
      # Checkpoint SAM → /app/checkpoints
      - ${CHECKPOINT_PATH}:/app/checkpoints:ro
      # Sorties → /app/outputs
      - ${OUTPUT_PATH}:/app/outputs:rw
      # Logs → /app/logs
      - ${LOG_PATH}:/app/logs:rw
      # Scripts Python (modifiables sans rebuild)
      - ./Scripts:/app/Scripts:ro
      # Config site
      - ./config.yaml:/app/config.yaml:ro

    shm_size: "16gb"
    restart: on-failure:3

    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"

    command: python /app/Scripts/RapidBenthos_part1.py

  # ── Test GPU + imports ─────────────────────────────────────────
  test-gpu:

    build:
      context: .
      dockerfile: Dockerfile

    image: rapidbenthos:latest
    container_name: rapidbenthos_test

    tty: true
    stdin_open: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    env_file: .env

    environment:
      - PYTHONPATH=/app/Scripts:/app
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - AGISOFT_LICENSE_KEY=${METASHAPE_LICENSE_KEY}

    volumes:
      - ${DATA_PATH}:/app/data:ro
      - ${PHOTOS_PATH}:/app/photos:ro
      - ${CHECKPOINT_PATH}:/app/checkpoints:ro
      - ${OUTPUT_PATH}:/app/outputs:rw
      - ${LOG_PATH}:/app/logs:rw
      - ./Scripts:/app/Scripts:ro
      - ./config.yaml:/app/config.yaml:ro

    shm_size: "4gb"
    restart: "no"

    command: python /app/Scripts/test_environment.py