name: rapidbenthos
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  # System geospatial stack (aligned GDAL/PROJ/GEOS)
  - gdal=3.9.*
  - proj=9.3.*
  - geos=3.12.*
  - libgdal=3.9.*
  - pyproj=3.6.*
  - shapely=2.0.*
  - rasterio=1.3.*
  - fiona=1.9.*
  - geopandas=0.14.*
  # Package managers
  - pip
  - uv